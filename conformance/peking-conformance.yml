      Repository of Peking University", adminEmail pkuir@lib.pku.edu.cn, earliestDatestamp
      2015-09-25T01:41:46Z, deletedRecord transient and granularity YYYY-MM-DDThh:mm:ssZ.
      ListMetadataFormats returns twelve prefixes and ListSets returns PKU faculty sets.
    location: openapi/peking-institutional-repository-oai-pmh-openapi.yml#/paths/~1request
    gaps: >-
