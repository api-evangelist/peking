notes:
  - >-
    OpenSCOW and CraneSched, published by the PKU High-Performance Computing group at
    github.com/PKUHPC, define their APIs in Protocol Buffers (roughly 40 .proto files
    across the two repositories) and generate an OpenAPI document at build time for the
    SCOW AI service. That is an institution-authored API contract, but it describes
    software a site deploys itself — the shipped document's only server is
    http://localhost:5006/api — so no hosted surface is claimed for it here.
