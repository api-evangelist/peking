note: >-
  Peking University publishes no versioning policy, deprecation policy, SLA or status page
  for any of its machine-readable surfaces. What versioning exists is inherited from the
  protocols themselves — OAI-PMH declares protocolVersion 2.0 in every response, SAML
  metadata is versioned by validUntil/cacheDuration, and the repository REST API is the
  unversioned DSpace 5/6-era /rest tree with no version segment in the path. This is
  normal for a university and is recorded rather than treated as a gap to be filled.
