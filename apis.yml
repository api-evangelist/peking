aid: peking
name: Peking University
x-type: university
x-category: Public Research University
description: >-
  Peking University (北京大学, PKU) is a public research university in Beijing and, with
  Tsinghua, one of the two apex institutions of the Chinese system. Like most universities
  it operates no central developer portal and publishes no OpenAPI, but unlike most it runs
  three genuinely institution-operated machine-readable surfaces. Its Institutional
  Repository at ir.pku.edu.cn — PKU Library, Handle prefix 20.500.11897, content back to
  2015 — answers an unauthenticated JSON REST API, a conforming OAI-PMH 2.0 endpoint
  advertising twelve metadata formats, and an OpenSearch Atom feed. Its Shibboleth identity
  provider publishes live SAML 2.0 metadata and has been in eduGAIN production since June
  2019. Most significantly, the Peking University Computer Center operates CARSI, China's
  national research-and-education identity federation and a full eduGAIN member, which is
  the registration authority for 1,042 federated entities and serves 500+ Chinese
  universities; PKU also runs the national eduroam service. The PKU HPC group additionally
  authors OpenSCOW and CraneSched, open-source HPC platform and scheduler whose APIs are
  defined in some forty Protocol Buffer files, though those describe self-hosted software
  rather than a hosted endpoint. The Dataverse-based Open Research Data Platform at
  opendata.pku.edu.cn was verified live in June 2026 but did not answer any HTTPS request
  during this pass. No API is documented for developers, none carries a versioning or
  deprecation policy, and campus systems — IAAA authentication, the 教学网 LMS, the
  registrar — are gated. The footprint is small, real, and almost entirely a by-product of
  scholarly infrastructure rather than a developer programme.
