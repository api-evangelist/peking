x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Three institution-operated machine-readable surfaces were probed live and are
    documented here: the Institutional Repository REST API, its OAI-PMH 2.0 endpoint, and
    the university's Shibboleth SAML 2.0 identity provider — plus CARSI, the national
    identity federation PKU itself operates, corroborated by eduGAIN's registry. No vendor
    contract is attributed to the institution. One previously verified surface, the
    Dataverse-based Open Research Data Platform at opendata.pku.edu.cn, was unreachable
    over HTTPS across seven attempts with browser user-agents, forced HTTP/1.1 and forced
    IPv4; TLS completed against PKU's own wildcard certificate and port 80 answered with a
    301, and every other pku.edu.cn host answered normally in the same window, so the host
    is treated as unreadable from our vantage point rather than absent. Campus systems
    (IAAA, the LMS, the registrar) are authentication-gated by design and are recorded as
    such, not as gaps.
