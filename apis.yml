- aid: peking:carsi
  name: CARSI — CERNET Authentication and Resource Sharing Infrastructure
  x-operator: institution
  x-operator-evidence: >-
    Operated by the Peking University Computer Center: the carsi.edu.cn footer reads 版权所有©北京大学计算中心, and
    eduGAIN's federation registry lists CARSI with the contact address carsi@pku.edu.cn, registration
    authority https://www.carsi.edu.cn, membership from 2019-05-24 and production from 2019-06-18. The
    federation runs on its own national domain rather than pku.edu.cn, but Peking University runs the
    federation.
  description: >-
    China's national identity federation for higher education and research, operated by Peking University
    and a full eduGAIN member. 1,042 SAML entities in eduGAIN carry CARSI as their registration authority
    — identity providers at 500+ Chinese universities and the service providers of international scholarly
    publishers — which makes this the largest programmable surface Peking University runs and one it runs
    on behalf of the whole sector. PKU also operates the national eduroam service at eduroam.edu.cn, listed
    with CARSI as CERNET basic infrastructure since October 2017.
  humanURL: https://www.carsi.edu.cn/
