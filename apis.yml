- aid: peking:openscow
  name: OpenSCOW / CraneSched research-computing APIs
  x-operator: institution
  x-operator-evidence: >-
    Every source file is copyright "Peking University and Peking University Institute for Computing and
    Digital Economy", released under Mulan PSL v2 from the PKU HPC group's own GitHub organisation.
  description: >-
    OpenSCOW ("Super Computing On Web") is an HPC portal and management system authored at Peking University;
    CraneSched is its distributed scheduler for HPC and AI workloads. Their APIs are defined in roughly
    forty Protocol Buffer files across portal, mis, audit, hook and scheduler services and consumed over
    gRPC, with an OpenAPI document generated at build time for the SCOW AI service. This is a real institution-authored
    API contract, but it describes software each site deploys itself — the generated document's only server
    is http://localhost:5006/api — so no hosted base URL is claimed.
  humanURL: https://pkuhpc.github.io/OpenSCOW/
  tags:
