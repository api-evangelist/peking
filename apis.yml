    2019-06-18.
  description: >-
    The university's federated identity provider, publishing live Shibboleth/SAML 2.0 metadata as machine-readable
    XML. Declares SAML 2.0 POST, POST-SimpleSign and Redirect SSO/SLO bindings, the legacy Shibboleth
    SSO profile, an AttributeAuthorityDescriptor, and SOAP ArtifactResolution / AttributeQuery / SLO endpoints
    on port 8443. This is the surface class universities operate by definition and almost never catalogue.
  humanURL: https://idp.pku.edu.cn/idp/shibboleth
